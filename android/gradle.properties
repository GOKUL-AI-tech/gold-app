org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Workaround for Kotlin incremental-cache crashes on Windows paths with spaces.
# Costs ~30s per build but stops "Storage ... is already registered" errors.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
# Keep the Kotlin compile in-process so it doesn't fight over cache files.
kotlin.compiler.execution.strategy=in-process
