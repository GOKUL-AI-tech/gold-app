name: goldvault_app
description: GoldVault - A digital gold savings mobile app powered by Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend
  supabase_flutter: ^2.5.6

  # State / utils
  intl: ^0.20.2
  google_fonts: ^8.0.2
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.2.3
  http: ^1.2.2
  razorpay_flutter: ^1.3.6
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
